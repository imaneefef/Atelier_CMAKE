name: Automatisation des tests
on: push

jobs:
  Compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilation + tests CMake
        run: |
          mkdir -p build && cd build
          cmake ..
          make
          make test

  Test_Add:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. && make
      - name: Run test "add" and capture report
        run: |
          cd build
          echo "== Test add 10 5 ==" > report.txt
          ./src/calculator add 10 5 | tee -a report.txt
          echo "" >> report.txt
      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-add-report
          path: build/report.txt
          retention-days: 14

  Test_Sub:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Test fonction sub
        run: |
          mkdir -p build && cd build
          cmake .. && make
          ./src/calculator sub 10 5

  Test_Mul:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Test fonction mul
        run: |
          mkdir -p build && cd build
          cmake .. && make
          ./src/calculator mul 10 5

  Test_Div:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Test fonction div
        run: |
          mkdir -p build && cd build
          cmake .. && make
          ./src/calculator div 10 5

  Test_Car:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. && make
      - name: Run test "car" and capture report
        run: |
          cd build
          echo "== Test car 5 (attendu : 25) ==" > report_car.txt
          RESULT=$(./src/calculator car 5)
          echo "Résultat : $RESULT" | tee -a report_car.txt
          if [ "$RESULT" = "25.000000" ]; then
            echo "Statut : OK" | tee -a report_car.txt
          else
            echo "Statut : ECHEC" | tee -a report_car.txt
            exit 1
          fi
      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-car-report
          path: build/report_car.txt
          retention-days: 14

  Deploy:
    runs-on: ubuntu-latest
    needs: [Test_Add, Test_Sub, Test_Mul, Test_Div, Test_Car]
    steps:
      - name: Deploy
        run: echo "Déploiement de la solution"
